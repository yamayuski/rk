services:
  workspace:
    image: rk/workspace:latest
    pull_policy: never
    build:
      context: .devcontainer
      dockerfile: Dockerfile
      args:
        USERNAME: ${USERNAME:-node}
        TZ: ${TZ:-UTC}
    command: sleep infinity
    volumes:
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-.}
        target: /workspace
    networks:
      - default

  claude:
    image: rk/agents:latest
    pull_policy: never
    build:
      context: .devcontainer/agents
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        USERNAME: ${USERNAME:-node}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        TZ: ${TZ:-UTC}
        LANGUAGE: ${LANGUAGE:-en}
        COUNTRY: ${COUNTRY:-US}
        ENCODING: ${ENCODING:-UTF-8}
        LOCALE: ${LOCALE:-"en_US.UTF-8 UTF-8"}
    volumes:
      - type: volume
        source: claude-code-bashhistory
        target: /commandhistory
      - type: volume
        source: claude-code-config
        target: /home/node/.claude
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-.}
        target: /workspace
    environment:
      - WORKSPACE_FOLDER=/workspace
    networks:
      - default
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]

  gemini:
    image: rk/agents:latest
    pull_policy: never
    volumes:
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-.}
        target: /workspace
      - type: volume
        source: gemini-bashhistory
        target: /commandhistory
      - type: volume
        source: gemini-config
        target: /home/node/.gemini
    environment:
      - WORKSPACE_FOLDER=/workspace
    networks:
      - default
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]

  redis:
    image: mirror.gcr.io/valkey/valkey:9.0-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gemini-cli}-redis
    volumes:
      - gemini-redis-data:/data
    restart: unless-stopped
    environment:
      VALKEY_EXTRA_FLAGS: "--save 60 1 --loglevel warning"

volumes:
  claude-code-bashhistory:
    driver: local
  claude-code-config:
    driver: local

  gemini-bashhistory:
    driver: local
  gemini-config:
    driver: local
  gemini-redis-data:
    driver: local
